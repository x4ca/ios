name: build-xhs-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'xhs_probe.c'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version
          ld64.lld --version || true

      - name: Build iOS arm64 dylib (no SDK needed)
        run: |
          set -e
          clang -target arm64-apple-ios13.0 \
                -dynamiclib -O2 -fPIC \
                -fuse-ld=lld \
                -Wl,-undefined,dynamic_lookup \
                -Wl,-platform_version -Wl,ios -Wl,13.0 -Wl,13.0 \
                -o xhs_probe.dylib xhs_probe.c
          file xhs_probe.dylib
          ls -l xhs_probe.dylib
          python3 - <<'PY'
          import struct
          d = open('xhs_probe.dylib','rb').read(32)
          print('magic', d[:4].hex(), 'cputype', hex(struct.unpack('<I', d[4:8])[0]))
          PY

      - name: Commit dylib back
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f xhs_probe.dylib
          git commit -m "build: xhs_probe.dylib" || echo "no change"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        with:
          name: xhs_probe.dylib
          path: xhs_probe.dylib
