name: build-xhs-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'xhs_probe.c'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          { clang --version; which ld64.lld; ld64.lld --version; } > toolchain.log 2>&1 || true

      - name: Build (with logging)
        run: |
          set +e
          : > build.log
          echo "--- variant A: -fuse-ld=lld" >> build.log
          clang -target arm64-apple-ios13.0 -dynamiclib -O2 -fPIC \
                -fuse-ld=lld -Wl,-undefined,dynamic_lookup \
                -Wl,-platform_version -Wl,ios -Wl,13.0 -Wl,13.0 \
                -o xhs_probe.dylib xhs_probe.c >> build.log 2>&1
          echo "exitA=$?" >> build.log

          if [ ! -f xhs_probe.dylib ]; then
            echo "--- variant B: --ld-path=ld64.lld" >> build.log
            clang -target arm64-apple-ios13.0 -dynamiclib -O2 -fPIC \
                  --ld-path=/usr/bin/ld64.lld -Wl,-undefined,dynamic_lookup \
                  -o xhs_probe.dylib xhs_probe.c >> build.log 2>&1
            echo "exitB=$?" >> build.log
          fi

          if [ ! -f xhs_probe.dylib ]; then
            echo "--- variant C: -nostdlib" >> build.log
            clang -target arm64-apple-ios13.0 -dynamiclib -O2 -fPIC -nostdlib \
                  --ld-path=/usr/bin/ld64.lld -Wl,-undefined,dynamic_lookup \
                  -o xhs_probe.dylib xhs_probe.c >> build.log 2>&1
            echo "exitC=$?" >> build.log
          fi

          { file xhs_probe.dylib; ls -l xhs_probe.dylib; } >> build.log 2>&1
          cat build.log

      - name: Commit artifacts and log
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add -f build.log toolchain.log 2>/dev/null || true
          git add -f xhs_probe.dylib 2>/dev/null || true
          git commit -m "build: logs + dylib" || echo "no change"
          git push || echo "push failed"
